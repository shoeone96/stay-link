spring:
  application:
    name: stay-link-batch
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      # 도메인 테이블(persistence 의 schema.sql)과 배치 메타 테이블(schema-batch.sql)을 같은 초기화로 만든다.
      # 두 스크립트 모두 IF NOT EXISTS 라 매 기동마다 실행해도 된다.
      schema-locations:
        - optional:classpath*:schema.sql
        - classpath:schema-batch.sql
  batch:
    jdbc:
      # Batch 가 제공하는 배포 스크립트는 IF NOT EXISTS 가 없고 실패를 삼키는 기본값(continue-on-error)이라
      # 쓰지 않는다. 메타 테이블은 위 schema-batch.sql 로 만든다 (D-F6-16).
      initialize-schema: never
  # 공급사 그룹 설정은 api-app 과 같은 형태다. 타임아웃 값의 근거는 README 에 있고, 실제 키는 환경 변수로 덮어쓴다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://localhost:9091
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://localhost:9092
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key

# 조합기의 상한. 검색용(fan-out)은 이 모듈이 쓰지 않지만 공급사 클라이언트 설정이 두 벌을 모두 요구한다.
supplier:
  # 이 모듈은 재고·요금 API 를 부르지 않지만, 공급사 클라이언트 설정이 바인딩 시점에 이 값을 요구한다(1 미만·부재 시 기동 실패).
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    max-concurrent: 2
    per-call: 4s
    budget: 5s
  catalog:
    fan-out:                       # 수집용. 배치가 기다리고 다 받는 것이 중요하므로 길다. 공급사 2 → 40s > ⌈2÷2⌉×30s
      max-concurrent: 2
      per-call: 30s
      budget: 40s
