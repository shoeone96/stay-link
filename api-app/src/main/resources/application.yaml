spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  # 공급사마다 그룹을 나눠야 커넥터가 갈리고 타임아웃·기본 헤더를 다르게 줄 수 있다.
  # 아래 값은 아직 실측한 것이 아니라 자리를 잡아 둔 것이다 — 실제 값은 모의 서버로 재서 채운다.
  # read-timeout 은 뒷그물이다. 실제 상한은 조합기 per-call 이 지므로 두 용도 중 긴 쪽보다 크게 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://localhost:9091
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key      # 모의 서버가 받는 자리표시자. 실제 키는 환경 변수로 덮어쓴다
      supplier-b:
        base-url: http://localhost:9092
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key

# 조합기의 상한. budget 은 per-call 보다 커야 하며, 어긋나면 기동이 실패한다.
# 지켜야 하는 부등식은 budget > ⌈공급사 수 ÷ max-concurrent⌉ × per-call 이다.
supplier:
  fan-out:                         # 검색용. 사용자가 기다리므로 짧다
    max-concurrent: 2
    per-call: 4s
    budget: 5s
  catalog:
    fan-out:                       # 수집용. 배치가 기다리고 다 받는 것이 중요하므로 길다. 공급사 2 → 40s > ⌈2÷2⌉×30s
      max-concurrent: 2
      per-call: 30s
      budget: 40s
