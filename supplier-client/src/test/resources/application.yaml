supplier:
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    max-concurrent: 2
    per-call: 2s
    budget: 5s
  catalog:
    fan-out:
      max-concurrent: 2
      per-call: 3s
      budget: 7s

spring:
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
        connect-timeout: 1s
        read-timeout: 2s
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://supplier-b.test
        connect-timeout: 1s
        read-timeout: 2s
        default-header:
          X-Api-Key: test-key
