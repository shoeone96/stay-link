supplier:
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    per-call: 2s
    budget: 5s
  resilience:
    max-attempts: 2
    min-backoff: 200ms
    max-backoff: 600ms
    jitter-factor: 0.5
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60s
    permitted-calls-in-half-open: 2
  catalog:
    fan-out:
      per-call: 3s
      budget: 7s
    resilience:
      max-attempts: 3
      min-backoff: 200ms
      max-backoff: 600ms
      jitter-factor: 0.5
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60s
      permitted-calls-in-half-open: 2

spring:
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
        connect-timeout: 1s
        read-timeout: 2s
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://supplier-b.test
        connect-timeout: 1s
        read-timeout: 2s
        default-header:
          X-Api-Key: test-key
