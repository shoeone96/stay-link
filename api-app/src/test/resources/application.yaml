spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  # 테스트는 소켓을 열지 않는다. 그래도 그룹 설정이 있어야 컨텍스트가 뜨므로 자리표시자만 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
      supplier-b:
        base-url: http://supplier-b.test

supplier:
  fan-out:
    max-concurrent: 2
    per-call: 2s
    budget: 5s
