spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  # 검색 결과 캐시의 Redis 접속. 접속 정보는 compose 자동 감지가 준다 (spring-boot-docker-compose 가 redis
  # 이미지를 인식한다). 두 타임아웃이 503 의 상한이다 — 저장소에 못 닿는 검색은 이 안에 503 으로 나간다.
  data:
    redis:
      connect-timeout: 300ms
      timeout: 300ms             # 명령 타임아웃
  # 공급사마다 그룹을 나눠야 커넥터가 갈리고 타임아웃·기본 헤더를 다르게 줄 수 있다.
  # 아래 값은 모의 서버를 띄우고 실제로 재서 정했다 (근거와 실측표는 README).
  # read-timeout 은 뒷그물이다. 실제 상한은 조합기 per-call 이 지므로 두 용도 중 긴 쪽보다 크게 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://localhost:9091
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key      # 모의 서버가 받는 자리표시자. 실제 키는 환경 변수로 덮어쓴다
      supplier-b:
        base-url: http://localhost:9092
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key

# max-codes 는 재고·요금 한 요청에 담을 수 있는 숙소 코드 수다. 초과분은 어댑터가 묶음으로 잘라 여러 번 부른다.
# 공급사별로 두는 이유는 지금 두 값이 같은 것이 우연이기 때문이다. 값이 없거나 1 미만이면 기동이 실패한다.
#
# 조합기의 상한(fan-out)은 budget 이 per-call 보다 커야 하며, 어긋나면 기동이 실패한다.
# 지켜야 하는 부등식은 budget > ⌈호출 수 ÷ max-concurrent⌉ × per-call 이고, 호출 수는 공급사 수가 아니라 묶음 수다.
supplier:
  a:
    availability:
      max-codes: 50              # 계약 §5 ②
  b:
    availability:
      max-codes: 50              # 계약 §6 ②
  fan-out:                         # 검색용. 사용자가 기다리므로 짧다
    max-concurrent: 2
    per-call: 4s
    budget: 5s
  catalog:
    fan-out:                       # 수집용. 배치가 기다리고 다 받는 것이 중요하므로 길다. 공급사 2 → 40s > ⌈2÷2⌉×30s
      max-concurrent: 2
      per-call: 30s
      budget: 40s

# 검색 결과 캐시. 같은 조건(날짜·인원)의 검색이 ttl 안에 다시 오면 공급사도 DB 도 부르지 않는다.
# ttl 은 정확성이 아니라 공급사 호출 절감 배수의 값이다 — 실측 후 재조정. 없거나 0 이하면 기동이 실패한다.
stay:
  search-cache:
    ttl: 30s
    enabled: true
