spring:
  application:
    name: stay-link-batch
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  batch:
    jdbc:
      # 테스트 DB 는 H2 라 운영용 schema-batch.sql(MySQL 전용)을 쓰지 않고 Batch 가 제공하는 H2 스크립트로
      # 메타 테이블을 만든다. 운영 스크립트의 검증은 MySQL 실기동으로 한다.
      initialize-schema: always
  # 테스트는 소켓을 열지 않는다. 그래도 그룹 설정이 있어야 컨텍스트가 뜨므로 자리표시자만 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://supplier-b.test
        default-header:
          X-Api-Key: test-key

supplier:
  # 이 모듈은 재고·요금 API 를 부르지 않지만, 공급사 클라이언트 설정이 바인딩 시점에 이 값을 요구한다(1 미만·부재 시 기동 실패).
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    per-call: 2s
    budget: 5s
  resilience:
    max-attempts: 2
    min-backoff: 200ms
    max-backoff: 600ms
    jitter-factor: 0.5
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60s
    permitted-calls-in-half-open: 2
  catalog:
    fan-out:
      per-call: 3s
      budget: 7s
    resilience:
      max-attempts: 3
      min-backoff: 200ms
      max-backoff: 600ms
      jitter-factor: 0.5
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60s
      permitted-calls-in-half-open: 2
