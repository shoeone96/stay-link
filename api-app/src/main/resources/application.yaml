spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  # 공급사마다 그룹을 나눠야 커넥터가 갈리고 타임아웃·기본 헤더를 다르게 줄 수 있다.
  # 아래 값은 모의 서버를 띄우고 실제로 재서 정했다 (근거와 실측표는 README).
  # read-timeout 은 뒷그물이다. 실제 상한은 조합기 per-call 이 지므로 두 용도 중 긴 쪽보다 크게 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://localhost:9091
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key      # 모의 서버가 받는 자리표시자. 실제 키는 환경 변수로 덮어쓴다
      supplier-b:
        base-url: http://localhost:9092
        connect-timeout: 1s
        read-timeout: 45s
        default-header:
          X-Api-Key: test-key

# max-codes 는 재고·요금 한 요청에 담을 수 있는 숙소 코드 수다. 초과분은 어댑터가 묶음으로 잘라 여러 번 부른다.
# 공급사별로 두는 이유는 지금 두 값이 같은 것이 우연이기 때문이다. 값이 없거나 1 미만이면 기동이 실패한다.
#
# 조합기의 상한(fan-out)은 budget 이 per-call 보다 커야 하며, 어긋나면 기동이 실패한다.
# 동시 호출 상한은 설정이 아니라 요청마다 호출 수로 잡히므로(웨이브가 항상 1) 이 부등식이 곧 완전한 조건이다.
supplier:
  a:
    availability:
      max-codes: 50              # 계약 §5 ②
  b:
    availability:
      max-codes: 50              # 계약 §6 ②
  fan-out:                         # 검색용. 사용자가 기다리므로 짧다
    per-call: 4s
    budget: 5s
  resilience:                      # 검색용 재시도·서킷. 아래 값의 단위는 논리 호출이 아니라 '시도'다
    max-attempts: 2                # 최초 호출을 포함한 총 시도 수. 재시도는 1회다
    min-backoff: 200ms
    max-backoff: 600ms
    jitter-factor: 0.5             # 재시도가 한꺼번에 몰리지 않게 대기를 흩는다
    sliding-window-size: 10
    minimum-number-of-calls: 5     # 기본값 100 을 그대로 쓰면 우리 트래픽에서는 서킷이 영영 열리지 않는다
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60s
    permitted-calls-in-half-open: 2  # 임계 50% 와 짝이라 탐침이 하나라도 실패하면 다시 열린다
  catalog:
    fan-out:                       # 수집용. 배치가 기다리고 다 받는 것이 중요하므로 길다. 공급사 2 → 40s > ⌈2÷2⌉×30s
      per-call: 30s
      budget: 40s
    resilience:                    # 수집용. 검색과 다른 것은 재시도 축뿐이다 —
      max-attempts: 3              # 배치가 기다리고 다 받는 것이 중요하므로 시도를 하나 더 준다
      min-backoff: 1s
      max-backoff: 3s
      jitter-factor: 0.5
      sliding-window-size: 10      # 서킷 판정은 '공급사가 아픈가'를 묻는 것이라 대기 주체와 무관하다
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60s
      permitted-calls-in-half-open: 2
