spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

# 이 파일이 main 쪽 application.yaml 을 가리므로 타임아웃도 여기 있어야 컨텍스트가 뜬다.
# 값은 운영과 같게 두고, 계층별 타임아웃을 실제로 재는 테스트만 짧은 값으로 덮어쓴다.
stay-link:
  http:
    timeout:
      connect: 2s
      read: 3s
      call-budget: 5s
