spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  # 테스트는 소켓을 열지 않는다. 그래도 그룹 설정이 있어야 컨텍스트가 뜨므로 자리표시자만 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://supplier-b.test
        default-header:
          X-Api-Key: test-key

supplier:
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    per-call: 2s
    budget: 5s
  resilience:
    max-attempts: 2
    min-backoff: 200ms
    max-backoff: 600ms
    jitter-factor: 0.5
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60s
    permitted-calls-in-half-open: 2
  catalog:
    fan-out:
      per-call: 3s
      budget: 7s
    resilience:
      max-attempts: 3
      min-backoff: 200ms
      max-backoff: 600ms
      jitter-factor: 0.5
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 60s
      permitted-calls-in-half-open: 2

# 테스트는 Redis 를 띄우지 않는다. enabled=false 면 저장소 대역(NoOp)이 떠서 F7 의 E2E 가 캐시 없이
# 돌던 때와 같은 경로를 지난다 — 캐시가 응답 계약을 바꾸지 않는다는 것의 근거다.
stay:
  search-cache:
    ttl: 30s
    enabled: false
