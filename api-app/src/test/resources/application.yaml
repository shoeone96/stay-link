spring:
  application:
    name: stay-link
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  # 테스트는 소켓을 열지 않는다. 그래도 그룹 설정이 있어야 컨텍스트가 뜨므로 자리표시자만 둔다.
  http:
    serviceclient:
      supplier-a:
        base-url: http://supplier-a.test
        default-header:
          X-Api-Key: test-key
      supplier-b:
        base-url: http://supplier-b.test
        default-header:
          X-Api-Key: test-key

supplier:
  a:
    availability:
      max-codes: 50
  b:
    availability:
      max-codes: 50
  fan-out:
    max-concurrent: 2
    per-call: 2s
    budget: 5s
  catalog:
    fan-out:
      max-concurrent: 2
      per-call: 3s
      budget: 7s
